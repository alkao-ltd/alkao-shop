<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b6ef3">
  <title>Alkao Shop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f4f8; color: #222; }
    header { background: #1b6ef3; color: white; padding: 16px; text-align: center; }
    header h1 { margin: 0; font-size: 22px; }
    main { padding: 16px; max-width: 420px; margin: 0 auto; }
    .carte { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .cache { display: none; }
    input { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
    button { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; border: none; border-radius: 8px; background: #1b6ef3; color: white; }
    button.lien { background: none; color: #1b6ef3; width: auto; padding: 8px 0; margin: 0 0 8px 0; }
    button.gris { background: #777; }
    button.petit { width: auto; margin: 0; padding: 8px 12px; font-size: 14px; }
    button.danger { background: #c0392b; }
    #message, #message-boutique, #message-produit { color: #c0392b; min-height: 20px; }
    h3 { margin: 16px 0 4px 0; }
    ul { list-style: none; padding: 0; margin: 12px 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
    li span, .info { font-size: 16px; word-break: break-word; }
    .info small { display: block; color: #555; margin-top: 4px; font-size: 14px; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    .vide { color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>Alkao Shop</h1>
  </header>

  <main>
    <div id="ecran-connexion" class="carte">
      <h2 id="titre">Connexion</h2>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="mdp" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
      <button id="btn-principal">Se connecter</button>
      <button id="btn-bascule" class="lien">Pas de compte ? Créer un compte</button>
      <p id="message"></p>
    </div>

    <div id="ecran-accueil" class="carte cache">
      <p id="qui"></p>
      <h2>Mes boutiques</h2>
      <input id="nom-boutique" type="text" placeholder="Nom de la boutique" maxlength="60">
      <button id="btn-ajouter">Ajouter la boutique</button>
      <p id="message-boutique"></p>
      <ul id="liste-boutiques"></ul>
      <button id="btn-deco" class="gris">Se déconnecter</button>
    </div>

    <div id="ecran-boutique" class="carte cache">
      <button id="btn-retour" class="lien">← Mes boutiques</button>
      <h2 id="titre-boutique"></h2>
      <h3 id="titre-formulaire">Ajouter un produit</h3>
      <input id="nom-produit" type="text" placeholder="Nom du produit" maxlength="60">
      <input id="prix-produit" type="number" inputmode="numeric" min="0" placeholder="Prix (FCFA)">
      <input id="stock-produit" type="number" inputmode="numeric" min="0" placeholder="Quantité en stock">
      <button id="btn-enregistrer-produit">Ajouter le produit</button>
      <button id="btn-annuler" class="gris cache">Annuler la modification</button>
      <p id="message-produit"></p>
      <h3>Mes produits</h3>
      <ul id="liste-produits"></ul>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      getDocs,
      writeBatch,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5pfMUT8xnSNeRAhgR5dbGRnXx_Itn09o",
      authDomain: "alka-shop-e10e2.firebaseapp.com",
      projectId: "alka-shop-e10e2",
      storageBucket: "alka-shop-e10e2.firebasestorage.app",
      messagingSenderId: "170951024988",
      appId: "1:170951024988:web:ff001f15fd2b0924ca6199"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ecranConnexion = document.getElementById("ecran-connexion");
    const ecranAccueil = document.getElementById("ecran-accueil");
    const ecranBoutique = document.getElementById("ecran-boutique");
    const titre = document.getElementById("titre");
    const champEmail = document.getElementById("email");
    const champMdp = document.getElementById("mdp");
    const btnPrincipal = document.getElementById("btn-principal");
    const btnBascule = document.getElementById("btn-bascule");
    const btnDeco = document.getElementById("btn-deco");
    const message = document.getElementById("message");
    const qui = document.getElementById("qui");
    const champNomBoutique = document.getElementById("nom-boutique");
    const btnAjouter = document.getElementById("btn-ajouter");
    const messageBoutique = document.getElementById("message-boutique");
    const listeBoutiques = document.getElementById("liste-boutiques");
    const btnRetour = document.getElementById("btn-retour");
    const titreBoutique = document.getElementById("titre-boutique");
    const titreFormulaire = document.getElementById("titre-formulaire");
    const champNomProduit = document.getElementById("nom-produit");
    const champPrix = document.getElementById("prix-produit");
    const champStock = document.getElementById("stock-produit");
    const btnEnregistrerProduit = document.getElementById("btn-enregistrer-produit");
    const btnAnnuler = document.getElementById("btn-annuler");
    const messageProduit = document.getElementById("message-produit");
    const listeProduits = document.getElementById("liste-produits");

    let modeInscription = false;
    let utilisateurActuel = null;
    let arreterEcouteBoutiques = null;
    let arreterEcouteProduits = null;
    let boutiqueActuelle = null;
    let produitEnModification = null;

    function montrer(ecran) {
      [ecranConnexion, ecranAccueil, ecranBoutique].forEach((e) => e.classList.add("cache"));
      ecran.classList.remove("cache");
    }

    function erreurEnFrancais(code) {
      const erreurs = {
        "auth/invalid-credential": "Email ou mot de passe incorrect.",
        "auth/invalid-email": "Cet email n'est pas valide.",
        "auth/email-already-in-use": "Cet email a déjà un compte.",
        "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
        "auth/missing-password": "Écris ton mot de passe.",
        "auth/network-request-failed": "Pas de connexion internet.",
        "auth/too-many-requests": "Trop d'essais. Attends un moment."
      };
      return erreurs[code] || "Une erreur est survenue. Réessaie.";
    }

    btnBascule.addEventListener("click", () => {
      modeInscription = !modeInscription;
      message.textContent = "";
      if (modeInscription) {
        titre.textContent = "Créer un compte";
        btnPrincipal.textContent = "Créer mon compte";
        btnBascule.textContent = "J'ai déjà un compte";
      } else {
        titre.textContent = "Connexion";
        btnPrincipal.textContent = "Se connecter";
        btnBascule.textContent = "Pas de compte ? Créer un compte";
      }
    });

    btnPrincipal.addEventListener("click", async () => {
      message.textContent = "";
      const email = champEmail.value.trim();
      const mdp = champMdp.value;
      try {
        if (modeInscription) {
          await createUserWithEmailAndPassword(auth, email, mdp);
        } else {
          await signInWithEmailAndPassword(auth, email, mdp);
        }
      } catch (e) {
        message.textContent = erreurEnFrancais(e.code);
      }
    });

    btnDeco.addEventListener("click", () => signOut(auth));

    function dossierBoutiques() {
      return collection(db, "users", utilisateurActuel.uid, "boutiques");
    }

    function dossierProduits() {
      return collection(db, "users", utilisateurActuel.uid, "boutiques", boutiqueActuelle.id, "produits");
    }

    btnAjouter.addEventListener("click", async () => {
      messageBoutique.textContent = "";
      const nom = champNomBoutique.value.trim();
      if (nom.length === 0) {
        messageBoutique.textContent = "Écris le nom de la boutique.";
        return;
      }
      btnAjouter.disabled = true;
      try {
        await addDoc(dossierBoutiques(), { nom: nom, creeLe: serverTimestamp() });
        champNomBoutique.value = "";
      } catch (e) {
        messageBoutique.textContent = "Impossible d'ajouter. Vérifie ta connexion.";
      }
      btnAjouter.disabled = false;
    });

    async function supprimerBoutique(id) {
      const produits = await getDocs(collection(db, "users", utilisateurActuel.uid, "boutiques", id, "produits"));
      const liste = produits.docs;
      for (let i = 0; i < liste.length; i += 400) {
        const lot = writeBatch(db);
        liste.slice(i, i + 400).forEach((d) => lot.delete(d.ref));
        await lot.commit();
      }
      await deleteDoc(doc(db, "users", utilisateurActuel.uid, "boutiques", id));
    }

    function afficherBoutiques(instantane) {
      listeBoutiques.innerHTML = "";
      if (instantane.empty) {
        const vide = document.createElement("li");
        vide.className = "vide";
        vide.textContent = "Aucune boutique pour le moment.";
        listeBoutiques.appendChild(vide);
        return;
      }
      instantane.forEach((d) => {
        const nomBoutique = d.data().nom;
        const li = document.createElement("li");
        const nom = document.createElement("span");
        nom.textContent = nomBoutique;

        const actions = document.createElement("div");
        actions.className = "actions";

        const btnOuvrir = document.createElement("button");
        btnOuvrir.className = "petit";
        btnOuvrir.textContent = "Ouvrir";
        btnOuvrir.addEventListener("click", () => ouvrirBoutique(d.id, nomBoutique));

        const btnSupprimer = document.createElement("button");
        btnSupprimer.className = "petit danger";
        btnSupprimer.textContent = "Supprimer";
        btnSupprimer.addEventListener("click", async () => {
          if (!confirm("Supprimer la boutique « " + nomBoutique + " » et tous ses produits ?")) return;
          messageBoutique.textContent = "";
          try {
            await supprimerBoutique(d.id);
          } catch (e) {
            messageBoutique.textContent = "Impossible de supprimer. Réessaie.";
          }
        });

        actions.appendChild(btnOuvrir);
        actions.appendChild(btnSupprimer);
        li.appendChild(nom);
        li.appendChild(actions);
        listeBoutiques.appendChild(li);
      });
    }

    function reinitialiserFormulaire() {
      produitEnModification = null;
      champNomProduit.value = "";
      champPrix.value = "";
      champStock.value = "";
      titreFormulaire.textContent = "Ajouter un produit";
      btnEnregistrerProduit.textContent = "Ajouter le produit";
      btnAnnuler.classList.add("cache");
      messageProduit.textContent = "";
    }

    function ouvrirBoutique(id, nom) {
      boutiqueActuelle = { id: id, nom: nom };
      titreBoutique.textContent = nom;
      reinitialiserFormulaire();
      listeProduits.innerHTML = "";
      montrer(ecranBoutique);
      if (arreterEcouteProduits) arreterEcouteProduits();
      const requete = query(dossierProduits(), orderBy("creeLe"));
      arreterEcouteProduits = onSnapshot(
        requete,
        afficherProduits,
        () => { messageProduit.textContent = "Impossible de charger les produits."; }
      );
    }

    function fermerBoutique() {
      if (arreterEcouteProduits) {
        arreterEcouteProduits();
        arreterEcouteProduits = null;
      }
      boutiqueActuelle = null;
      reinitialiserFormulaire();
      listeProduits.innerHTML = "";
    }

    btnRetour.addEventListener("click", () => {
      fermerBoutique();
      montrer(ecranAccueil);
    });

    function formaterFcfa(n) {
      return Number(n).toLocaleString("fr-FR") + " FCFA";
    }

    function afficherProduits(instantane) {
      listeProduits.innerHTML = "";
      if (instantane.empty) {
        const vide = document.createElement("li");
        vide.className = "vide";
        vide.textContent = "Aucun produit pour le moment.";
        listeProduits.appendChild(vide);
        return;
      }
      instantane.forEach((d) => {
        const p = d.data();
        const li = document.createElement("li");

        const info = document.createElement("div");
        info.className = "info";
        const nom = document.createElement("strong");
        nom.textContent = p.nom;
        const detail = document.createElement("small");
        detail.textContent = formaterFcfa(p.prix) + " · Stock : " + p.stock;
        info.appendChild(nom);
        info.appendChild(detail);

        const actions = document.createElement("div");
        actions.className = "actions";

        const btnModifier = document.createElement("button");
        btnModifier.className = "petit";
        btnModifier.textContent = "Modifier";
        btnModifier.addEventListener("click", () => {
          produitEnModification = d.id;
          champNomProduit.value = p.nom;
          champPrix.value = p.prix;
          champStock.value = p.stock;
          titreFormulaire.textContent = "Modifier le produit";
          btnEnregistrerProduit.textContent = "Enregistrer les changements";
          btnAnnuler.classList.remove("cache");
          messageProduit.textContent = "";
          champNomProduit.focus();
        });

        const btnSupprimer = document.createElement("button");
        btnSupprimer.className = "petit danger";
        btnSupprimer.textContent = "Supprimer";
        btnSupprimer.addEventListener("click", async () => {
          if (!confirm("Supprimer le produit « " + p.nom + " » ?")) return;
          messageProduit.textContent = "";
          try {
            await deleteDoc(doc(db, "users", utilisateurActuel.uid, "boutiques", boutiqueActuelle.id, "produits", d.id));
            if (produitEnModification === d.id) reinitialiserFormulaire();
          } catch (e) {
            messageProduit.textContent = "Impossible de supprimer. Réessaie.";
          }
        });

        actions.appendChild(btnModifier);
        actions.appendChild(btnSupprimer);
        li.appendChild(info);
        li.appendChild(actions);
        listeProduits.appendChild(li);
      });
    }

    btnAnnuler.addEventListener("click", reinitialiserFormulaire);

    btnEnregistrerProduit.addEventListener("click", async () => {
      messageProduit.textContent = "";
      const nom = champNomProduit.value.trim();
      const prix = Number(champPrix.value);
      const stock = Number(champStock.value);

      if (nom.length === 0) {
        messageProduit.textContent = "Écris le nom du produit.";
        return;
      }
      if (champPrix.value === "" || !Number.isInteger(prix) || prix < 0 || prix > 100000000) {
        messageProduit.textContent = "Prix invalide : écris un nombre entier en FCFA.";
        return;
      }
      if (champStock.value === "" || !Number.isInteger(stock) || stock < 0 || stock > 1000000) {
        messageProduit.textContent = "Stock invalide : écris un nombre entier.";
        return;
      }

      btnEnregistrerProduit.disabled = true;
      try {
        if (produitEnModification) {
          await updateDoc(
            doc(db, "users", utilisateurActuel.uid, "boutiques", boutiqueActuelle.id, "produits", produitEnModification),
            { nom: nom, prix: prix, stock: stock, modifieLe: serverTimestamp() }
          );
        } else {
          await addDoc(dossierProduits(), { nom: nom, prix: prix, stock: stock, creeLe: serverTimestamp() });
        }
        reinitialiserFormulaire();
      } catch (e) {
        messageProduit.textContent = "Impossible d'enregistrer. Vérifie ta connexion.";
      }
      btnEnregistrerProduit.disabled = false;
    });

    onAuthStateChanged(auth, (utilisateur) => {
      if (arreterEcouteBoutiques) {
        arreterEcouteBoutiques();
        arreterEcouteBoutiques = null;
      }
      fermerBoutique();
      utilisateurActuel = utilisateur;
      if (utilisateur) {
        qui.textContent = "Connecté : " + utilisateur.email;
        montrer(ecranAccueil);
        const requete = query(dossierBoutiques(), orderBy("creeLe"));
        arreterEcouteBoutiques = onSnapshot(
          requete,
          afficherBoutiques,
          () => { messageBoutique.textContent = "Impossible de charger tes boutiques."; }
        );
      } else {
        montrer(ecranConnexion);
        listeBoutiques.innerHTML = "";
        champMdp.value = "";
      }
    });
  </script>
</body>
  </html>
